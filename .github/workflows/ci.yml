name: ci

on:
  push:
    branches: [loom]
  pull_request:
    branches: [loom]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Full history: `check-kernel.mjs` walks `git log` from kernel.json's `since`.
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Order matters: typecheck emits dist/, which the surface guard reads. It builds with
      # `tsc -b --force`, so the .d.ts the surface guard diffs is always this commit's.
      # A fresh checkout has no dist/ and would build anyway; the flag is for every other
      # machine, and CI is where its cost is paid rather than where its value is.
      - run: npm run typecheck
      - run: npm test
      # Invariant 1's enforcement in this job. `build:binary`'s esbuild metafile backstop
      # runs in the `binary` job below rather than here, so this script is no longer alone
      # — but it stays the one that runs on every commit without a SEA toolchain, which is
      # why it grew a third check for the loads a parser cannot read (createRequire,
      # computed import(), require).
      - run: node scripts/check-zero-dep.mjs
      - run: node scripts/check-surface.mjs
      # THE THIRD GUARD, which CI ran none of until now. `package.json`'s `check` script runs
      # all three and this workflow ran two, so the kernel seam ledger — the one guard whose
      # output is a public count nobody may quietly reset — was exercised by nothing outside a
      # maintainer's own shell. That is the same gap the binary job below exists to close, one
      # file over.
      #
      # `fetch-depth: 0` on this job's checkout is REQUIRED and is not tidiness:
      # `check-kernel.mjs` walks `git log` from `scripts/kernel.json`'s `since` commit, and
      # `actions/checkout@v4` clones depth 1 by default, so the step fails on every run — a
      # guard that always fails is the constant-gate failure this repo names, and it would have
      # been switched off within a week.
      - run: node scripts/check-kernel.mjs

  # WHY THIS JOB EXISTS, and why it is a job rather than a step in `check`.
  #
  # `bin/loom` is gitignored and nothing rebuilt it: on 2026-09-02 the binary on the
  # maintainer's own machine was built 2026-08-25 13:52, with 48 of 62 `packages/core/src`
  # files newer than it, and it answered `--help` with exit 0. It did not warn, because the
  # freshness guard that would have warned shipped three days AFTER it was built —
  # `grep -ac 'THIS BINARY IS STALE' bin/loom` returned 0. A guard that rides inside the
  # artifact cannot report its own absence, so the build that injects it has to be exercised
  # by something outside. Nothing was: this workflow never built the binary at all.
  #
  # `verify-binary.mjs` drives the produced artifact through the guard's four cases (current,
  # stale, overridden, shipped-without-sources). Run against that 08-25 binary it fails two of
  # them; against a binary built from this tree it passes all four. It also puts the esbuild
  # metafile backstop — the one that fails if third-party code ever reaches the bundle — on a
  # machine that runs it every commit.
  #
  # SEPARATE JOB because `npm run check` must not get slower: the binary is ~115 MB of output
  # and the guard's own header argues against a check-time staleness gate. This runs in
  # parallel with `check` and blocks nothing it does. Measured on the maintainer's machine,
  # 2026-09-02: `tsc` 2s, bundle+SEA+inject 5s, verify 4s.
  #
  # The artifact is NOT uploaded, and that is now a sequencing decision rather than an absence of
  # one. `DESIGN.md` Sequence item 29 decided distribution on 2026-09-23: the package is
  # `@caohaotiantian/loom`, built and verified locally, and the maintainer publishes it by hand.
  # A release workflow — tarball to npm, binaries to a GitHub release — is the step AFTER that first
  # publish, not a per-commit upload from this job. What this job proves is unchanged: the binary is
  # reproducible from a known tree and the guard survives the build.
  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The script COMPILES `dist` itself now, so `build:binary` and `build-binary.mjs` are the
      # same thing and neither can bundle a stale `dist`. It used to be `npm run build && …`,
      # and the hazard was running the script directly: `distIsBehindSources` decided on mtime
      # alone, so a touched or cache-restored `dist` let a binary certify sources it does not
      # contain. `dist` is now a function of `src` by construction — see build-binary.mjs §0.
      - run: npm run build:binary
      - run: node scripts/verify-binary.mjs
      # And the binary as a stranger gets it: copied out of the tree, the README's examples run.
      - run: node scripts/smoke-install.mjs bin/loom

  # THE INSTALL, DRIVEN — `DESIGN.md` Sequence item 29. Every other job runs `loom` out of the
  # checkout, which cannot see the defects that live only in an installed copy: a `bin` that printed
  # nothing through npm's symlink, a `--version` that printed the usage, a tarball that died at ESM
  # link time on the wrong Node. `pack.mjs` compiles and refuses a `dist` file with no source;
  # `smoke-install.mjs` installs the tarball offline into a temp HOME, locally and with
  # `-g --prefix`, and runs the README's first two examples through it. Both platforms, because
  # the install path is where they differ (npm's bin links, `#!/usr/bin/env node`).
  #
  # NOT in `npm run check`, which must not spawn npm or need a packed artifact. NOTHING IS
  # PUBLISHED: `packages/core` stays `private: true` until the maintainer publishes by hand.
  install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/pack.mjs --out out
      - run: node scripts/smoke-install.mjs out/*.tgz
