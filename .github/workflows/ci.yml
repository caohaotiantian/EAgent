name: ci

on:
  push:
    branches: [loom]
  pull_request:
    branches: [loom]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Order matters: typecheck emits dist/, which the surface guard reads.
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/check-zero-dep.mjs
      - run: node scripts/check-surface.mjs
